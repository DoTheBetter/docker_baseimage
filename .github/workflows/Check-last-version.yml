name: Check last version

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai  # 通过环境变量设置时区，避免 sudo timedatectl 权限问题
    strategy:
      fail-fast: false  # 单个矩阵任务失败不影响其他任务
      max-parallel: 1   # 串行执行避免 git push 冲突
      matrix:
        include:
          # GitHub Release 模式 - 单仓库版本检查
          - name: Caddy
            mode: github-release
            repo: caddyserver/caddy
            version_file: versions/caddy_ver.txt
            dockerfile: dockerfiles/Dockerfile.caddy2
            event_type: caddy2-on-update
            version_pattern: '^v?[0-9]+(\.[0-9]+){2}$'
            strip_v: 'true'

          - name: ZeroTierOne
            mode: github-release
            repo: zerotier/ZeroTierOne
            version_file: versions/zerotier_ver.txt
            dockerfile: dockerfiles/Dockerfile.zerotier
            event_type: zerotier-on-update
            version_pattern: '^v?[0-9]+(\.[0-9]+){2}$'
            strip_v: 'false'

          # npm 多包模式 - 多个 npm 包版本检查（包名列表，逗号分隔）
          - name: Composerize
            mode: npm-multi
            npm_packages: "composerize,decomposerize,composeverter"  # npm 包名列表
            repo_urls: "composerize/composerize,composerize/decomposerize,outilslibre/composeverter"  # 对应 GitHub 仓库列表
            version_file: versions/composerize_ver.txt
            dockerfile: dockerfiles/Dockerfile.composerize
            event_type: composerize-on-update
            version_pattern: '^v?[0-9]+(\.[0-9]+){2}$'
            strip_v: 'true'

          # Git SHA 模式 - 基于提交哈希的版本检查
          - name: IT-Tools
            mode: git-sha
            repo: sharevb/it-tools
            version_file: versions/it-tools_ver.txt
            event_type: it-tools-on-update

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Git and Timezone
        run: |
          # 配置 Git 用户信息
          git config --global user.name "DTB"
          git config --global user.email "183888664+DoTheBetter@users.noreply.github.com"
          
          # 时区已通过 job 级 env: TZ 设置
          echo "当前时区: $(date +%Z) ($(date))"
          
          # 拉取最新代码
          git config --global pull.rebase false  # 明确合并策略
          git pull

      - name: Setup Node.js
        if: matrix.mode == 'npm-multi'
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      # ==================== 版本检查 ====================
      - name: Check version (GitHub Release)
        if: matrix.mode == 'github-release'
        id: check_github_release
        run: |
          set -e
          # 确保版本文件存在
          if [ ! -e "${{ matrix.version_file }}" ]; then
            touch "${{ matrix.version_file }}"
          fi

          # 获取当前版本和最新版本
          version_old=$(cat "${{ matrix.version_file }}")
          version_new=$(curl -s "https://api.github.com/repos/${{ matrix.repo }}/releases/latest" | grep "tag_name" | cut -f4 -d "\"")
          
          # 处理版本号格式
          if [ "${{ matrix.strip_v }}" = "true" ] && [ ! -z "$version_new" ]; then
            version_new=$(echo "$version_new" | sed 's/^v//')
          fi

          # 验证版本格式（先判空，再校验格式）
          if [ -z "$version_new" ]; then
            echo "错误：获取新版本为空"
            version_new=$version_old
          elif ! echo "$version_new" | grep -qE "${{ matrix.version_pattern }}"; then
            echo "错误：获取的版本号 $version_new 格式不正确"
            version_new=$version_old
          fi

          echo "获取Release版本为 $version_new"
          echo "当前旧版本为 $version_old"

          # 设置输出变量
          echo "old_version=$version_old" >> $GITHUB_OUTPUT
          echo "new_version=$version_new" >> $GITHUB_OUTPUT
          echo "version_display=$version_new" >> $GITHUB_OUTPUT
          
          # 检查版本是否需要更新
          if [ "$version_old" != "$version_new" ]; then
            echo "version_updated=true" >> $GITHUB_OUTPUT
          else
            echo "未检查到${{ matrix.name }}版本更新，已退出！"
            echo "version_updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Check version (npm multi)
        if: matrix.mode == 'npm-multi'
        id: check_npm_multi
        run: |
          set -e
          # 解析包名列表为数组
          IFS=',' read -ra packages <<< "${{ matrix.npm_packages }}"
          
          # 确保版本文件存在并初始化
          if [ ! -e "${{ matrix.version_file }}" ]; then
            for pkg in "${packages[@]}"; do
              echo "${pkg}=" >> "${{ matrix.version_file }}"
            done
          fi
          
          # 清空临时文件（用于传递新版本给 Update 步骤）
          > /tmp/npm_new_versions.txt
          
          version_display=""
          version_updated="false"
          
          # 遍历每个包检查版本
          for pkg in "${packages[@]}"; do
            # 获取当前版本
            version_old=$(grep "^${pkg}=" "${{ matrix.version_file }}" | cut -d'=' -f2)
            
            # 获取最新版本
            version_new=$(npm view "${pkg}" version)
            
            # 处理版本号格式
            if [ "${{ matrix.strip_v }}" = "true" ] && [ ! -z "$version_new" ]; then
              version_new=$(echo "$version_new" | sed 's/^v//')
            fi
            
            # 验证版本格式
            if [ -z "$version_new" ] || ! echo "$version_new" | grep -qE "${{ matrix.version_pattern }}"; then
              echo "错误：获取 ${pkg} 版本号 $version_new 格式不正确，使用旧版本 $version_old"
              version_new=$version_old
            fi
            
            echo "获取 ${pkg} 版本为 $version_new，当前旧版本为 $version_old"
            
            # 写入临时文件供 Update 步骤使用
            echo "${pkg}=${version_new}" >> /tmp/npm_new_versions.txt
            
            # 构建版本显示字符串（用 / 分隔）
            if [ -z "$version_display" ]; then
              version_display="$version_new"
            else
              version_display="${version_display}/${version_new}"
            fi
            
            # 检查是否需要更新
            if [ "$version_old" != "$version_new" ]; then
              version_updated="true"
            fi
          done
          
          # 设置输出变量
          echo "version_display=$version_display" >> $GITHUB_OUTPUT
          echo "version_updated=$version_updated" >> $GITHUB_OUTPUT
          
          if [ "$version_updated" = "true" ]; then
            echo "检测到至少一个${{ matrix.name }}版本更新"
          else
            echo "未检查到${{ matrix.name }}版本更新，已退出！"
          fi

      - name: Check version (Git SHA)
        if: matrix.mode == 'git-sha'
        id: check_git_sha
        run: |
          set -e
          # 确保版本文件存在
          if [ ! -e "${{ matrix.version_file }}" ]; then
            touch "${{ matrix.version_file }}"
          fi

          # 获取当前版本和最新提交的SHA
          version_old=$(cat "${{ matrix.version_file }}")
          git clone --depth 1 https://github.com/${{ matrix.repo }}.git temp_repo
          cd temp_repo
          version_new=$(git rev-parse --short HEAD)
          cd ..
          rm -rf temp_repo
          
          # 验证SHA格式
          if [ -z "$version_new" ]; then
            echo "错误：获取新SHA为空"
            version_new=$version_old
          fi

          echo "获取最新提交SHA为 $version_new"
          echo "当前旧版本为 $version_old"

          # 设置输出变量
          echo "old_version=$version_old" >> $GITHUB_OUTPUT
          echo "new_version=$version_new" >> $GITHUB_OUTPUT
          echo "version_display=$version_new" >> $GITHUB_OUTPUT
          
          # 检查版本是否需要更新
          if [ "$version_old" != "$version_new" ]; then
            echo "version_updated=true" >> $GITHUB_OUTPUT
          else
            echo "未检查到${{ matrix.name }}版本更新，已退出！"
            echo "version_updated=false" >> $GITHUB_OUTPUT
          fi

      # ==================== 统一更新标志 ====================
      - name: Set update flag
        id: update_flag
        if: always()
        run: |
          # 汇总各模式的更新状态（只有一个模式会执行，其余为空）
          updated="false"
          if [ "${{ steps.check_github_release.outputs.version_updated }}" = "true" ] || \
             [ "${{ steps.check_npm_multi.outputs.version_updated }}" = "true" ] || \
             [ "${{ steps.check_git_sha.outputs.version_updated }}" = "true" ]; then
            updated="true"
          fi
          echo "version_updated=$updated" >> $GITHUB_OUTPUT
          # 拼接所有模式的版本显示（仅当前模式有值）
          echo "version_display=${{ steps.check_github_release.outputs.version_display }}${{ steps.check_npm_multi.outputs.version_display }}${{ steps.check_git_sha.outputs.version_display }}" >> $GITHUB_OUTPUT

      # ==================== 更新版本文件和 README ====================
      - name: Update Version Files and README (GitHub Release)
        if: steps.update_flag.outputs.version_updated == 'true' && matrix.mode == 'github-release'
        run: |
          # 更新版本文件
          echo "${{ steps.check_github_release.outputs.new_version }}" > "${{ matrix.version_file }}"
          
          # 更新Dockerfile中的版本
          sed -ri "s@[0-9]+\.[0-9]+\.[0-9]+@${{ steps.check_github_release.outputs.new_version }}@g" "${{ matrix.dockerfile }}"
          
          # 获取当前时间
          current_date=$(date +"%Y-%m-%d %H:%M:%S")
          
          # 更新README中的版本信息
          if grep -q "| ${{ matrix.name }}\s*|" README.md; then
            # 更新现有行
            sed -ri "s@(\| ${{ matrix.name }}\s*\| )[^|]+(\s*\| )[^|]+(\s*\| )([^|]+)(\s*\|)@\1${{ steps.check_github_release.outputs.new_version }}\2$current_date\3\4\5@" README.md
          else
            # 添加新行
            sed -i "/^| ----------- |/a| ${{ matrix.name }} | ${{ steps.check_github_release.outputs.new_version }} | $current_date | https://github.com/${{ matrix.repo }} |" README.md
          fi

      - name: Update Version Files and README (npm multi)
        if: steps.update_flag.outputs.version_updated == 'true' && matrix.mode == 'npm-multi'
        run: |
          # 从临时文件读取新版本，循环更新版本文件
          while IFS='=' read -r pkg version; do
            sed -i "s/^${pkg}=.*/${pkg}=${version}/" "${{ matrix.version_file }}"
          done < /tmp/npm_new_versions.txt
          
          # 获取当前时间
          current_date=$(date +"%Y-%m-%d %H:%M:%S")
          
          # 更新README中的版本信息
          if grep -q "| ${{ matrix.name }}\s*|" README.md; then
            # 更新现有行
            sed -ri "s@(\| ${{ matrix.name }}\s*\| )[^|]+(\s*\| )[^|]+(\s*\| )([^|]+)(\s*\|)@\1${{ steps.check_npm_multi.outputs.version_display }}\2$current_date\3\4\5@" README.md
          else
            # 添加新行，使用第一个 repo 作为链接
            IFS=',' read -ra repos <<< "${{ matrix.repo_urls }}"
            first_repo="${repos[0]}"
            sed -i "/^| ----------- |/a| ${{ matrix.name }} | ${{ steps.check_npm_multi.outputs.version_display }} | $current_date | https://github.com/${first_repo} |" README.md
          fi

      - name: Update Version Files and README (Git SHA)
        if: steps.update_flag.outputs.version_updated == 'true' && matrix.mode == 'git-sha'
        run: |
          # 更新版本文件
          echo "${{ steps.check_git_sha.outputs.new_version }}" > "${{ matrix.version_file }}"

          # 获取当前时间
          current_date=$(date +"%Y-%m-%d %H:%M:%S")
          
          # 更新README中的版本信息
          if grep -q "| ${{ matrix.name }}\s*|" README.md; then
            # 更新现有行
            sed -i "s/| ${{ matrix.name }}\s*| [a-f0-9]\{7\} | [^|]\+ |/| ${{ matrix.name }} | ${{ steps.check_git_sha.outputs.new_version }} | $current_date |/" README.md
          else
            # 添加新行
            sed -i "/^| ----------- |/a| ${{ matrix.name }} | ${{ steps.check_git_sha.outputs.new_version }} | $current_date | https://github.com/${{ matrix.repo }} |" README.md
          fi

      # ==================== Git 操作 ====================
      - name: Git Operations
        if: steps.update_flag.outputs.version_updated == 'true'
        run: |
          # 暂存当前工作区的未提交改动，避免 pull --rebase 因 unstaged changes 失败
          git add .
          git stash
          # 拉取最新代码避免并发冲突
          git pull --rebase
          # 恢复之前暂存的改动
          git stash pop
          git add .
          # 仅当有文件变更时才提交，避免无变更时 commit 失败
          git diff --cached --quiet || git commit -m "更新 ${{ matrix.name }} Release 版本至 ${{ steps.update_flag.outputs.version_display }}"
          git push

      # ==================== 触发构建工作流 ====================
      - name: Trigger Build Workflow
        if: steps.update_flag.outputs.version_updated == 'true'
        run: |
          curl -X POST https://api.github.com/repos/DoTheBetter/docker_baseimage/dispatches \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"event_type":"${{ matrix.event_type }}"}'

  # 清理工作流运行历史记录
  Cleanup:
    needs: [check]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Cleanup Workflow
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 1
